<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek · Запуск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            background: radial-gradient(circle at 0% 0%, rgba(255, 50, 50, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 100% 0%, rgba(50, 130, 255, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(180, 70, 255, 0.3) 0%, transparent 45%),
                        radial-gradient(circle at 0% 100%, rgba(255, 220, 50, 0.2) 0%, transparent 45%),
                        #0f0e14;
            background-blend-mode: normal;
            opacity: 0;
            animation: bgAppear 1.2s ease forwards;
            animation-delay: 0.1s;
        }

        @keyframes bgAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .launch-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 48px;
            background: rgba(10, 8, 18, 0.25);
            backdrop-filter: blur(2px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            padding: 40px 30px;
            border: 1px solid rgba(255,255,255,0.02);
            transition: min-height 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
            z-index: 5;
        }

        /* Приветствие */
        .greeting {
            font-weight: 500;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 0 30px rgba(180, 70, 255, 0.3);
            opacity: 0;
            transform: scale(0.98) translateY(12px);
            transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1), transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            user-select: none;
        }
        .greeting.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .greeting.hide {
            opacity: 0;
            transform: scale(0.96) translateY(-20px);
            transition: opacity 0.6s, transform 0.6s;
        }

        /* Строка ввода */
        .input-area {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.23, 1, 0.32, 1), transform 0.7s cubic-bezier(0.23, 1, 0.32, 1), max-width 0.8s cubic-bezier(0.23, 1, 0.32, 1), margin-top 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }
        .input-area.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .input-area.shrink {
            max-width: 600px;
            margin-top: 0;
            opacity: 1;
            transform: translateY(0) scale(0.95);
            pointer-events: auto;
            transition: max-width 0.7s, transform 0.7s, opacity 0.5s, margin-top 0.7s;
        }

        .input-wrapper {
            width: 100%;
            display: flex;
            background: rgba(20, 18, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 6px 6px 6px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: border 0.2s, box-shadow 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: rgba(180, 70, 255, 0.4);
            box-shadow: 0 8px 40px rgba(130, 70, 255, 0.15);
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 10px 16px 0;
            font-size: 1.2rem;
            font-weight: 400;
            color: #f0edf5;
            outline: none;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
        }
        #userInput::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 400;
        }

        #sendBtn {
            background: rgba(130, 70, 255, 0.15);
            border: none;
            border-radius: 50px;
            padding: 12px 28px;
            font-weight: 500;
            font-size: 1.05rem;
            color: #d4c8ff;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.25s;
            border: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 0.3px;
        }
        #sendBtn:hover {
            background: rgba(160, 100, 255, 0.25);
            border-color: rgba(180, 130, 255, 0.3);
            transform: scale(1.02);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(140, 70, 255, 0.2);
        }
        #sendBtn:active {
            transform: scale(0.96);
        }

        /* Чат — карточка, которая растягивается */
        .chat-wrapper {
            width: 100%;
            max-width: 820px;
            margin-top: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), max-height 0.9s cubic-bezier(0.23, 1, 0.32, 1), margin-top 0.8s;
            pointer-events: none;
            max-height: 0;
            overflow: hidden;
            background: rgba(14, 12, 24, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .chat-wrapper.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            max-height: 700px;
            margin-top: 20px;
            transition: opacity 0.8s, transform 0.8s, max-height 0.9s ease, margin-top 0.7s;
        }

        .chat-box {
            padding: 24px 24px 16px 24px;
            overflow-y: auto;
            color: #eae6f5;
            font-size: 1.05rem;
            line-height: 1.6;
            letter-spacing: -0.01em;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 650px;
            min-height: 80px;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(180, 130, 255, 0.3);
            border-radius: 20px;
        }

        /* Сообщения — как в мессенджере */
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            animation: msgFade 0.35s ease;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 1rem;
        }
        .message.user {
            align-self: flex-end;
            background: rgba(130, 70, 255, 0.25);
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(180, 130, 255, 0.15);
            color: #f0edf5;
        }
        .message.assistant {
            align-self: flex-start;
            background: rgba(30, 28, 48, 0.5);
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e0daf0;
        }
        .message.error {
            align-self: flex-start;
            background: rgba(180, 50, 50, 0.15);
            border-left: 3px solid rgba(255, 80, 80, 0.4);
            color: #ffb0b0;
            border-bottom-left-radius: 6px;
        }

        @keyframes msgFade {
            0% { opacity: 0; transform: translateY(12px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .typing-indicator {
            align-self: flex-start;
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(30, 28, 48, 0.3);
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #b0a0d0;
            border-radius: 50%;
            animation: dotPulse 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.25; transform: scale(0.7); }
            30% { opacity: 1; transform: scale(1.2); }
        }

        /* свечения на заднем плане */
        .launch-container::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 50, 50, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            animation: glowPulse 8s infinite alternate;
        }
        .launch-container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(180, 70, 255, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            animation: glowPulse2 10s infinite alternate;
        }

        @keyframes glowPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(40px, -20px); opacity: 1; }
        }
        @keyframes glowPulse2 {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.3) translate(-30px, 30px); opacity: 1; }
        }

        @media (max-width: 600px) {
            .launch-container { padding: 30px 16px; border-radius: 32px; }
            .input-wrapper { padding: 4px 4px 4px 16px; }
            #userInput { font-size: 1rem; padding: 14px 6px 14px 0; }
            #sendBtn { padding: 10px 18px; font-size: 0.95rem; }
            .greeting { font-size: 3.2rem; }
            .message { max-width: 90%; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="launch-container" id="launchContainer">
    <div class="content">
        <div class="greeting" id="greeting">начнем?</div>

        <div class="input-area" id="inputArea">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Задайте вопрос..." autocomplete="off" />
                <button id="sendBtn">→ Отправить</button>
            </div>
        </div>

        <div class="chat-wrapper" id="chatWrapper">
            <div class="chat-box" id="chatBox"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        const greeting = document.getElementById('greeting');
        const inputArea = document.getElementById('inputArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatWrapper = document.getElementById('chatWrapper');
        const chatBox = document.getElementById('chatBox');

        const API_KEY = 'sk-d477e68c6f444b12ad449a4465c76a6e';
        const BASE_URL = 'https://api.deepseek.com/v1/chat/completions';

        let firstMessageSent = false;
        let isWaiting = false;

        function playStartupSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(420, now);
                osc1.frequency.exponentialRampToValueAtTime(580, now + 0.25);
                gain1.gain.setValueAtTime(0.08, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.6);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(620, now + 0.1);
                osc2.frequency.exponentialRampToValueAtTime(780, now + 0.35);
                gain2.gain.setValueAtTime(0.05, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.7);

                const bufferSize = audioCtx.sampleRate * 0.03;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gainNoise = audioCtx.createGain();
                gainNoise.gain.setValueAtTime(0.03, now + 0.02);
                gainNoise.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                noise.connect(gainNoise);
                gainNoise.connect(audioCtx.destination);
                noise.start(now + 0.02);
                noise.stop(now + 0.2);
            } catch (e) {}
        }

        playStartupSound();

        setTimeout(() => {
            greeting.classList.add('show');
        }, 1200);

        setTimeout(() => {
            greeting.classList.add('hide');
            setTimeout(() => {
                inputArea.classList.add('show');
                userInput.focus();
            }, 550);
        }, 2500);

        function addMessage(role, content, isError = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            if (isError) msgDiv.classList.add('error');
            msgDiv.textContent = content;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatBox.appendChild(typing);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        async function askDeepSeek(prompt) {
            if (isWaiting) return;
            isWaiting = true;
            showTyping();

            try {
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: 'Ты дружелюбный AI-помощник.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 700,
                        stream: false
                    })
                });

                removeTyping();

                if (!response.ok) {
                    let errorMsg = `Ошибка API (${response.status})`;
                    if (response.status === 402) {
                        errorMsg = '⚠️ Недостаточно средств на балансе. Пополните счёт в личном кабинете DeepSeek.';
                    } else {
                        try {
                            const errData = await response.json();
                            if (errData?.error?.message) errorMsg += `: ${errData.error.message}`;
                        } catch (_) {}
                    }
                    addMessage('assistant', errorMsg, true);
                    isWaiting = false;
                    return;
                }

                const data = await response.json();
                const reply = data?.choices?.[0]?.message?.content || 'Пустой ответ от сервера.';
                addMessage('assistant', reply);

            } catch (error) {
                removeTyping();
                addMessage('assistant', `❌ Ошибка соединения: ${error.message}`, true);
            }

            isWaiting = false;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || isWaiting) return;

            if (!firstMessageSent) {
                firstMessageSent = true;
                inputArea.classList.add('shrink');
                chatWrapper.classList.add('active');
                // Плавно увеличиваем контейнер
                document.getElementById('launchContainer').style.minHeight = '700px';
            }

            addMessage('user', text);
            userInput.value = '';
            userInput.focus();

            await askDeepSeek(text);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        userInput.addEventListener('blur', () => {
            if (firstMessageSent) {
                setTimeout(() => userInput.focus(), 100);
            }
        });

        console.log('🚀 DeepSeek запущен! API ключ:', API_KEY.slice(0,10)+'...');
    })();
</script>
</body>
</html>
