<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek · Запуск</title>
    <!-- Google Font для современного вида -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            /* начальный фон для свечений, но градиенты создаются через псевдоэлементы */
            background: radial-gradient(circle at 0% 0%, rgba(255, 50, 50, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 100% 0%, rgba(50, 130, 255, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(180, 70, 255, 0.3) 0%, transparent 45%),
                        radial-gradient(circle at 0% 100%, rgba(255, 220, 50, 0.2) 0%, transparent 45%),
                        #0f0e14;
            background-blend-mode: normal;
            opacity: 0;
            animation: bgAppear 1.2s ease forwards;
            animation-delay: 0.1s;
            transition: background 0.3s;
        }

        /* плавное появление фона */
        @keyframes bgAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* основной контейнер — центрирование + каркас */
        .launch-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 48px;
            background: rgba(10, 8, 18, 0.25);
            backdrop-filter: blur(2px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            padding: 40px 30px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.02);
        }

        /* центральный контент — появление поэтапное */
        .content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
            z-index: 5;
        }

        /* 1. Главный заголовок "начнем?" — появляется и исчезает */
        .greeting {
            font-weight: 500;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 0 30px rgba(180, 70, 255, 0.3);
            opacity: 0;
            transform: scale(0.98) translateY(12px);
            transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1), transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            user-select: none;
        }
        .greeting.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .greeting.hide {
            opacity: 0;
            transform: scale(0.96) translateY(-20px);
            transition: opacity 0.6s, transform 0.6s;
        }

        /* 2. Строка ввода (изначально скрыта, потом сдвигается вниз) */
        .input-area {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.23, 1, 0.32, 1), transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
        }
        .input-area.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        /* состояние когда строка ввода уходит вниз (после первого запроса) */
        .input-area.shrink {
            max-width: 480px;
            transform: translateY(60px) scale(0.92);
            opacity: 0.8;
            pointer-events: auto;
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s, max-width 0.7s;
        }

        .input-wrapper {
            width: 100%;
            display: flex;
            background: rgba(20, 18, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 6px 6px 6px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: border 0.2s, box-shadow 0.2s;
        }
        .input-wrapper:focus-within {
            border-color: rgba(180, 70, 255, 0.4);
            box-shadow: 0 8px 40px rgba(130, 70, 255, 0.15);
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 10px 16px 0;
            font-size: 1.2rem;
            font-weight: 400;
            color: #f0edf5;
            outline: none;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.01em;
        }
        #userInput::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        #sendBtn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 50px;
            padding: 12px 28px;
            font-weight: 500;
            font-size: 1.05rem;
            color: #d8d0f0;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.25s;
            border: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 0.3px;
            background: rgba(130, 70, 255, 0.15);
            color: #d4c8ff;
        }
        #sendBtn:hover {
            background: rgba(160, 100, 255, 0.25);
            border-color: rgba(180, 130, 255, 0.3);
            transform: scale(1.02);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(140, 70, 255, 0.2);
        }
        #sendBtn:active {
            transform: scale(0.96);
        }

        /* 3. Окно чата (появляется после первого запроса) */
        .chat-wrapper {
            width: 100%;
            max-width: 820px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            max-height: 0;
            overflow: hidden;
        }
        .chat-wrapper.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            max-height: 700px;
            overflow-y: auto;
            transition: opacity 0.8s, transform 0.8s, max-height 0.9s ease;
        }

        .chat-box {
            background: rgba(14, 12, 24, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 28px 28px 18px 28px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            min-height: 120px;
            max-height: 420px;
            overflow-y: auto;
            color: #eae6f5;
            font-size: 1.05rem;
            line-height: 1.6;
            letter-spacing: -0.01em;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(180, 130, 255, 0.3);
            border-radius: 20px;
        }

        .message {
            margin-bottom: 18px;
            padding: 12px 18px;
            border-radius: 24px;
            background: rgba(40, 35, 60, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.02);
            animation: msgFade 0.4s ease;
        }
        .message.user {
            background: rgba(130, 70, 255, 0.12);
            border-left: 3px solid rgba(180, 130, 255, 0.3);
        }
        .message.assistant {
            background: rgba(20, 25, 40, 0.4);
            border-left: 3px solid rgba(100, 180, 255, 0.2);
        }

        @keyframes msgFade {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 10px 0;
            color: #a098c0;
            font-size: 1rem;
            align-items: center;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #b0a0d0;
            border-radius: 50%;
            animation: dotPulse 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.2); }
        }

        .hidden { display: none; }

        /* дополнительные свечения на заднем плане — псевдоэлементы */
        .launch-container::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 50, 50, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            animation: glowPulse 8s infinite alternate;
        }
        .launch-container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(180, 70, 255, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            animation: glowPulse2 10s infinite alternate;
        }

        @keyframes glowPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(40px, -20px); opacity: 1; }
        }
        @keyframes glowPulse2 {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.3) translate(-30px, 30px); opacity: 1; }
        }

        /* адаптив */
        @media (max-width: 600px) {
            .launch-container { padding: 30px 16px; border-radius: 32px; }
            .input-wrapper { padding: 4px 4px 4px 16px; }
            #userInput { font-size: 1rem; padding: 14px 6px 14px 0; }
            #sendBtn { padding: 10px 18px; font-size: 0.95rem; }
            .greeting { font-size: 3.2rem; }
        }
    </style>
</head>
<body>

<div class="launch-container" id="launchContainer">
    <div class="content">
        <!-- приветствие -->
        <div class="greeting" id="greeting">начнем?</div>

        <!-- строка ввода -->
        <div class="input-area" id="inputArea">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Задайте вопрос..." autocomplete="off" />
                <button id="sendBtn">→ Отправить</button>
            </div>
        </div>

        <!-- чат -->
        <div class="chat-wrapper" id="chatWrapper">
            <div class="chat-box" id="chatBox">
                <!-- сюда будут добавляться сообщения -->
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- Элементы ---
        const greeting = document.getElementById('greeting');
        const inputArea = document.getElementById('inputArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatWrapper = document.getElementById('chatWrapper');
        const chatBox = document.getElementById('chatBox');

        // --- API ключ (ваш) ---
        const API_KEY = 'sk-ae790b13aaa94e4c86b185199cdc6ee6';
        const BASE_URL = 'https://api.deepseek.com/v1/chat/completions';

        // --- флаг первого сообщения ---
        let firstMessageSent = false;
        let isWaiting = false;

        // --- звук появления (используем Web Audio синтез) ---
        function playStartupSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                // два тона с огибающей, имитация "запуска"
                const now = audioCtx.currentTime;

                // первый тон
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(420, now);
                osc1.frequency.exponentialRampToValueAtTime(580, now + 0.25);
                gain1.gain.setValueAtTime(0.08, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.6);

                // второй тон (чуть выше)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(620, now + 0.1);
                osc2.frequency.exponentialRampToValueAtTime(780, now + 0.35);
                gain2.gain.setValueAtTime(0.05, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.7);

                // шумовой "щелчок" для эффекта
                const bufferSize = audioCtx.sampleRate * 0.03;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gainNoise = audioCtx.createGain();
                gainNoise.gain.setValueAtTime(0.03, now + 0.02);
                gainNoise.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                noise.connect(gainNoise);
                gainNoise.connect(audioCtx.destination);
                noise.start(now + 0.02);
                noise.stop(now + 0.2);
            } catch (e) {
                // если звук не воспроизведётся — игнорируем
                console.log('Audio not supported');
            }
        }

        // --- воспроизводим звук при старте ---
        playStartupSound();

        // --- Последовательное появление: фон уже появился (body animation) ---

        // Этап 1: появление надписи "начнем?" через 1.2с
        setTimeout(() => {
            greeting.classList.add('show');
        }, 1200);

        // Этап 2: через 2.5с надпись исчезает, появляется строка ввода
        setTimeout(() => {
            greeting.classList.add('hide');
            // после исчезновения показываем input
            setTimeout(() => {
                inputArea.classList.add('show');
                userInput.focus();
            }, 550);
        }, 2500);

        // --- Функция добавления сообщения в чат ---
        function addMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.textContent = content;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- Показать индикатор печати ---
        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';
            typing.innerHTML = 'DeepSeek думает <span></span><span></span><span></span>';
            chatBox.appendChild(typing);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // --- Запрос к DeepSeek API ---
        async function askDeepSeek(prompt) {
            if (isWaiting) return;
            isWaiting = true;
            // показываем индикатор
            showTyping();

            try {
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: 'Ты дружелюбный AI-помощник.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 700,
                        stream: false
                    })
                });

                removeTyping();

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    let errorMsg = `Ошибка API (${response.status})`;
                    if (errData?.error?.message) errorMsg += `: ${errData.error.message}`;
                    addMessage('assistant', `⚠️ ${errorMsg}`);
                    isWaiting = false;
                    return;
                }

                const data = await response.json();
                const reply = data?.choices?.[0]?.message?.content || 'Пустой ответ от сервера.';
                addMessage('assistant', reply);

            } catch (error) {
                removeTyping();
                addMessage('assistant', `❌ Ошибка соединения: ${error.message}`);
            }

            isWaiting = false;
        }

        // --- Обработчик отправки ---
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || isWaiting) return;

            // если это первое сообщение, трансформируем интерфейс
            if (!firstMessageSent) {
                firstMessageSent = true;
                // строка ввода сдвигается вниз и уменьшается
                inputArea.classList.add('shrink');
                // показываем чат
                chatWrapper.classList.add('active');
                // фокус остаётся
            }

            // добавить сообщение пользователя
            addMessage('user', text);
            userInput.value = '';
            userInput.focus();

            // отправить запрос
            await askDeepSeek(text);
        }

        // --- События ---
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        // если после первой отправки фокус теряется, возвращаем
        userInput.addEventListener('blur', () => {
            if (firstMessageSent) {
                setTimeout(() => userInput.focus(), 100);
            }
        });

        // Небольшой трюк: если первое сообщение не отправлено, но пользователь кликает в инпут — фокус
        // уже есть.

        console.log('🚀 DeepSeek запущен! API ключ:', API_KEY.slice(0,10)+'...');
    })();
</script>
</body>
</html>
