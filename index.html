<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek · Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            background: radial-gradient(circle at 0% 0%, rgba(255, 50, 50, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 100% 0%, rgba(50, 130, 255, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(180, 70, 255, 0.3) 0%, transparent 45%),
                        radial-gradient(circle at 0% 100%, rgba(255, 220, 50, 0.2) 0%, transparent 45%),
                        #0f0e14;
            background-blend-mode: normal;
            opacity: 0;
            animation: bgAppear 1.2s ease forwards;
            animation-delay: 0.1s;
        }

        @keyframes bgAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 48px;
            background: rgba(10, 8, 18, 0.25);
            backdrop-filter: blur(2px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            padding: 40px 30px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 50, 50, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
            animation: glowPulse 8s infinite alternate;
        }
        .container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(180, 70, 255, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
            animation: glowPulse2 10s infinite alternate;
        }

        @keyframes glowPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(40px, -20px); opacity: 1; }
        }
        @keyframes glowPulse2 {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.3) translate(-30px, 30px); opacity: 1; }
        }

        .content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
            z-index: 5;
        }

        .greeting {
            font-weight: 500;
            font-size: clamp(2.5rem, 8vw, 4rem);
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 0 30px rgba(180, 70, 255, 0.3);
            opacity: 0;
            transform: scale(0.98) translateY(12px);
            transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1), transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: none;
            user-select: none;
            text-align: center;
            font-weight: 600;
        }
        .greeting.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .greeting.hide {
            opacity: 0;
            transform: scale(0.96) translateY(-20px);
            transition: opacity 0.6s, transform 0.6s;
        }

        .pin-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Поле для ввода PIN-кода */
        .pin-display {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .pin-digit {
            width: 56px;
            height: 68px;
            background: rgba(20, 18, 30, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 600;
            color: #f0edf5;
            transition: border 0.3s, box-shadow 0.3s, transform 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .pin-digit.active {
            border-color: rgba(180, 70, 255, 0.4);
            box-shadow: 0 0 30px rgba(130, 70, 255, 0.1);
            transform: scale(1.02);
        }

        .pin-digit.filled {
            border-color: rgba(100, 200, 150, 0.3);
            box-shadow: 0 0 20px rgba(100, 200, 150, 0.05);
        }

        .pin-digit.error {
            border-color: rgba(255, 70, 70, 0.5);
            box-shadow: 0 0 30px rgba(255, 70, 70, 0.15);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* Клавиатура нампада */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .numpad-btn {
            background: rgba(30, 28, 48, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px 0;
            font-size: 1.6rem;
            font-weight: 500;
            color: #f0edf5;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .numpad-btn:hover {
            background: rgba(60, 55, 90, 0.5);
            border-color: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }

        .numpad-btn:active {
            transform: scale(0.94);
            background: rgba(130, 70, 255, 0.15);
        }

        .numpad-btn.empty {
            background: transparent;
            border: none;
            cursor: default;
            pointer-events: none;
        }

        .numpad-btn.empty:hover {
            transform: none;
            background: transparent;
        }

        .numpad-btn.delete {
            background: rgba(180, 50, 50, 0.15);
            border-color: rgba(180, 50, 50, 0.15);
            color: rgba(255, 150, 150, 0.7);
            font-size: 1.2rem;
        }

        .numpad-btn.delete:hover {
            background: rgba(180, 50, 50, 0.25);
            border-color: rgba(180, 50, 50, 0.25);
            color: rgba(255, 150, 150, 0.9);
        }

        .numpad-btn.delete:active {
            background: rgba(180, 50, 50, 0.35);
        }

        /* Статус ошибки */
        .error-message {
            color: rgba(255, 80, 80, 0.7);
            font-size: 0.9rem;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
        }

        .error-message.show {
            opacity: 1;
        }

        .success-message {
            color: rgba(100, 200, 150, 0.7);
            font-size: 0.9rem;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
        }

        .success-message.show {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; border-radius: 32px; max-width: 100%; }
            .pin-digit { width: 48px; height: 60px; font-size: 1.8rem; }
            .numpad { max-width: 240px; gap: 8px; }
            .numpad-btn { padding: 14px 0; font-size: 1.4rem; }
            .greeting { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="content">
        <div class="greeting" id="greeting">🔐</div>

        <div class="pin-title">Введите код для входа на сайт</div>

        <div class="pin-display" id="pinDisplay">
            <div class="pin-digit" id="digit1"></div>
            <div class="pin-digit" id="digit2"></div>
            <div class="pin-digit" id="digit3"></div>
            <div class="pin-digit" id="digit4"></div>
        </div>

        <div class="error-message" id="errorMessage">❌ Неверный код. Попробуйте снова.</div>
        <div class="success-message" id="successMessage">✅ Доступ разрешён!</div>

        <div class="numpad" id="numpad">
            <button class="numpad-btn" data-value="1">1</button>
            <button class="numpad-btn" data-value="2">2</button>
            <button class="numpad-btn" data-value="3">3</button>
            <button class="numpad-btn" data-value="4">4</button>
            <button class="numpad-btn" data-value="5">5</button>
            <button class="numpad-btn" data-value="6">6</button>
            <button class="numpad-btn" data-value="7">7</button>
            <button class="numpad-btn" data-value="8">8</button>
            <button class="numpad-btn" data-value="9">9</button>
            <button class="numpad-btn empty"></button>
            <button class="numpad-btn" data-value="0">0</button>
            <button class="numpad-btn delete" id="deleteBtn">⌫</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const greeting = document.getElementById('greeting');
        const digits = [
            document.getElementById('digit1'),
            document.getElementById('digit2'),
            document.getElementById('digit3'),
            document.getElementById('digit4')
        ];
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const numpadButtons = document.querySelectorAll('.numpad-btn[data-value]');
        const deleteBtn = document.getElementById('deleteBtn');

        const CORRECT_PIN = '2066';
        let enteredPin = '';
        let isLocked = false;

        // Анимация появления
        setTimeout(() => {
            greeting.classList.add('show');
        }, 800);

        setTimeout(() => {
            greeting.classList.add('hide');
            setTimeout(() => {
                greeting.style.display = 'none';
            }, 600);
        }, 1800);

        // Обновление отображения PIN-кода
        function updatePinDisplay() {
            for (let i = 0; i < 4; i++) {
                const digit = digits[i];
                const value = enteredPin[i] || '';
                digit.textContent = value;
                digit.classList.remove('active', 'filled', 'error');
                
                if (value) {
                    digit.classList.add('filled');
                }
                
                // Подсвечиваем текущую позицию
                if (i === enteredPin.length && enteredPin.length < 4) {
                    digit.classList.add('active');
                }
            }

            // Убираем подсветку если уже заполнено
            if (enteredPin.length >= 4) {
                digits[3].classList.remove('active');
            }

            // Скрываем сообщения при вводе
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        // Проверка PIN-кода
        function checkPin() {
            if (enteredPin.length !== 4) return;

            if (enteredPin === CORRECT_PIN) {
                // ✅ Правильный код
                successMessage.classList.add('show');
                errorMessage.classList.remove('show');
                isLocked = true;
                
                // Подсветка зелёным
                digits.forEach(d => {
                    d.style.borderColor = 'rgba(100, 200, 150, 0.5)';
                    d.style.boxShadow = '0 0 30px rgba(100, 200, 150, 0.1)';
                });

                console.log('✅ Доступ разрешён! Код верный.');
                // Здесь можно добавить действие после успешного входа
                
                setTimeout(() => {
                    // Например, показать что-то или перейти на другую страницу
                }, 500);

            } else {
                // ❌ Неверный код
                digits.forEach(d => {
                    d.classList.remove('filled', 'active');
                    d.classList.add('error');
                });
                
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                
                setTimeout(() => {
                    digits.forEach(d => {
                        d.classList.remove('error');
                    });
                }, 600);

                // Сброс через 0.8 секунды
                setTimeout(() => {
                    enteredPin = '';
                    updatePinDisplay();
                    // Возвращаем нормальный цвет
                    digits.forEach(d => {
                        d.style.borderColor = 'rgba(255, 255, 255, 0.08)';
                        d.style.boxShadow = 'none';
                    });
                }, 1000);
            }
        }

        // Обработка нажатия на кнопку цифры
        function handleDigit(value) {
            if (isLocked) return;
            if (enteredPin.length >= 4) return;

            enteredPin += value;
            updatePinDisplay();

            if (enteredPin.length === 4) {
                checkPin();
            }
        }

        // Обработка удаления
        function handleDelete() {
            if (isLocked) return;
            if (enteredPin.length === 0) return;

            enteredPin = enteredPin.slice(0, -1);
            updatePinDisplay();
            
            // Сброс цветов
            digits.forEach(d => {
                d.style.borderColor = 'rgba(255, 255, 255, 0.08)';
                d.style.boxShadow = 'none';
            });
            
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }

        // Назначение обработчиков для цифр
        numpadButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const value = btn.dataset.value;
                if (value !== undefined) {
                    handleDigit(value);
                    // Тактильный отклик
                    btn.style.transform = 'scale(0.94)';
                    setTimeout(() => {
                        btn.style.transform = '';
                    }, 150);
                }
            });
        });

        // Обработчик для кнопки удаления
        deleteBtn.addEventListener('click', handleDelete);

        // Поддержка клавиатуры
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                e.preventDefault();
                handleDigit(e.key);
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                handleDelete();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (enteredPin.length === 4) {
                    checkPin();
                }
            }
        });

        // Инициализация
        updatePinDisplay();

        console.log('🔐 Интерфейс входа с PIN-кодом');
        console.log('📝 Код: 2066');
    })();
</script>
</body>
</html>
